# App (perfil prod) + MySQL. Para rodar sem Docker, veja o README (perfil dev com H2).
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: osmanager
      MYSQL_USER: ${DB_USERNAME:-osmuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-osmuser_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/osmanager?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-osmuser}
      DB_PASSWORD: ${DB_PASSWORD:-osmuser_password}
      # Sem ferramenta de migração (Flyway/Liquibase): o schema é criado pelo Hibernate.
      # Ok para demo; em produção, adote migrations e volte para "validate".
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
