# Dockerfile de Desenvolvimento com Hot Reload
# Use com: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d


services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ENV: development
    
    environment:
      APP_ENV: development
      JAVA_OPTS: -Xmx1024m -Xms512m -XX:+UseG1GC
    
    # Volumes para hot reload
    volumes:
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml
      - app_logs:/usr/local/tomcat/logs
    
    # Exposição de porta de debug
    ports:
      - "5005:5005"
    
    # Comando com recompilação automática (opcional)
    # command: bash -c "while true; do mvn compile; sleep 5; done"
    
    restart: unless-stopped

