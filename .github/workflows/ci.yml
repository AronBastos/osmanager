name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:

jobs:
  test:
    name: Build + testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build e testes
        run: mvn -B verify
