# ==============================================================
# DEV Profile — application-dev.yml
# ==============================================================
# INTERVIEW NOTE (Topic 4): Spring Profiles
# Activated with: --spring.profiles.active=dev
# This file is ONLY loaded when the "dev" profile is active.
#
# Use case: different databases, logging levels, and feature flags
# per environment WITHOUT changing any code.
#
# Q: "How do you run different configs per environment in Spring Boot?"
# A: Create application-{profile}.yml files. Set the active profile
#    via --spring.profiles.active=prod or SPRING_PROFILES_ACTIVE env var.
#    Spring Boot merges the base application.yml with the profile-specific one.
# ==============================================================

spring:
  datasource:
    # H2 in-memory DB for local development — no MySQL needed
    url: jdbc:h2:mem:osmanager_dev;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Console: access at http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    # create-drop: creates schema on startup, drops on shutdown
    # Use "update" if you want data to persist across restarts (dev only)
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  # Separate database name from prod, same pattern as the H2 "osmanager_dev" above.
  # Still needs a real Mongo instance reachable (docker compose up -d mongo) —
  # unlike H2, there's no in-memory embedded Mongo wired into this project.
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/osmanager_dev}

# Verbose logging in dev
logging:
  level:
    com.osmanager: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    # TRACE on BasicBinder shows the actual parameter VALUES in SQL logs
    # — invaluable for debugging N+1 and query issues

server:
  port: 8080

# Swagger UI available at: http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
