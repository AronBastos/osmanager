<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      ng-app="osmanagerApp">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>OSManager - Sistema de Gestão de Ordens de Serviço</title>
    <link rel="stylesheet" href="#{request.contextPath}/resources/css/style.css"/>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="#{request.contextPath}/app/js/app.js"></script>
</h:head>

<h:body>
    <div class="container" ng-controller="MainController">
        <h1>{{ message }}</h1>
        <p>Sistema completo para gestão de oficinas mecânicas</p>

        <h2>Menu Principal</h2>
        <ul>
            <li ng-repeat="item in menuItems"><h:link value="{{ item.name }}" outcome="{{ item.link }}"/></li>
        </ul>
    </div>
</h:body>

</html>
